services:
  vk-bot:
    build: .
    container_name: eh_vk_bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./downloads:/app/downloads
    environment:
      - DB_URL=sqlite+aiosqlite:///./data/bot.db
      - API_HOST=0.0.0.0
      - API_PORT=45000
    stop_grace_period: 15s
    ports:
      - "45000:45000"
